<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ご予約の空き状況｜合同会社しっぽ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{--brown:#603912;--ink:#3b2a1a;--sub:#7a6a58;--line:#EFE7DA;--bg:#fffdf8;--cream:#f6efe4;--o:#2f7d4f;--s:#c98a1b;--x:#b8463a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h2{font-family:"Noto Serif JP",serif;color:var(--brown);font-size:20px;text-align:center;margin-bottom:4px}
.upd{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-family:"Noto Serif JP",serif;font-size:18px;color:var(--brown)}
.nav button{border:1px solid var(--line);background:#fff;color:var(--brown);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{font-size:12px;font-weight:700;padding:6px 0;background:var(--cream);color:var(--sub)}
th:first-child{color:var(--x)} th:last-child{color:#3a6ea5}
td{border-top:1px solid var(--line);vertical-align:top;padding:4px 2px 6px;text-align:center;height:66px}
td .d{font-size:13px;font-weight:700;margin-bottom:3px}
td.sun .d{color:var(--x)} td.sat .d{color:#3a6ea5}
td.past{background:#f4f1ec} td.past .row{visibility:hidden}
td.today{box-shadow:inset 0 0 0 2px var(--brown)}
.row{display:flex;justify-content:center;align-items:center;gap:2px;font-size:11px;line-height:1.5;color:var(--sub)}
.m{font-size:15px;font-weight:700;width:16px}
.m.o{color:var(--o)} .m.s{color:var(--s)} .m.x{color:var(--x)} .m.h{color:#aaa}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--sub);margin:10px 0 4px}
.legend .m{width:auto}
.cta{margin-top:12px;text-align:center;font-size:13px;line-height:1.7}
.cta a{display:inline-block;margin-top:6px;background:var(--brown);color:#fff;text-decoration:none;border-radius:24px;padding:10px 22px;font-weight:700}
@media(max-width:380px){td{height:60px}.row{font-size:10px}.m{font-size:13px;width:13px}}
</style></head><body><div class="wrap">
<h2>ご予約の空き状況</h2>
<p class="upd" id="upd"></p>
<div class="nav"><button id="prev">‹ 前の月</button><b id="ttl"></b><button id="next">次の月 ›</button></div>
<table><thead><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr></thead><tbody id="cal"></tbody></table>
<div class="legend">
 <span><span class="m o">○</span> 空きあり</span><span><span class="m s">△</span> 残りわずか</span><span><span class="m x">×</span> 満枠</span>
 <span>シ＝ペットシッター</span><span>ケ＝訪問ケア</span>
</div>
<div class="cta" id="cta">空き状況は目安です。ご予約・ご相談はお気軽にどうぞ。<br><a href="https://www.shippo21.com/contact" target="_top">ご予約・お問い合わせ</a></div>
</div>
<script>
const MARK={o:"○",s:"△",x:"×","-":"休"}, CLS={o:"o",s:"s",x:"x","-":"h"};
const MONTHS=3; // 今月から3か月分
let data={sitter:{},care:{}}, now=new Date(), base=new Date(now.getFullYear(),now.getMonth(),1), off=0;
const pad=n=>String(n).padStart(2,"0"), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function cell(kind,k){const v=(data[kind]||{})[k]||"o";return `<span class="row">${kind==="sitter"?"シ":"ケ"}<span class="m ${CLS[v]}">${MARK[v]}</span></span>`}
function draw(){
 const m=new Date(base.getFullYear(),base.getMonth()+off,1);
 document.getElementById("ttl").textContent=`${m.getFullYear()}年${m.getMonth()+1}月`;
 prev.disabled=off<=0; next.disabled=off>=MONTHS-1;
 const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 let h="<tr>", wd=m.getDay(); for(let i=0;i<wd;i++)h+="<td></td>";
 const last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
 for(let d=1;d<=last;d++){
  const dt=new Date(m.getFullYear(),m.getMonth(),d),k=key(dt),w=dt.getDay();
  const c=[w===0?"sun":w===6?"sat":"",dt<today?"past":"",+dt===+today?"today":""].join(" ");
  h+=`<td class="${c}"><div class="d">${d}</div>${cell("sitter",k)}${cell("care",k)}</td>`;
  if(w===6&&d<last)h+="</tr><tr>";
 }
 const tail=(7-new Date(m.getFullYear(),m.getMonth(),last).getDay()-1);for(let i=0;i<tail;i++)h+="<td></td>";
 cal.innerHTML=h+"</tr>";
}
prev.onclick=()=>{off--;draw()}; next.onclick=()=>{off++;draw()};
const q=new URLSearchParams(location.search); if(q.get("m"))off=+q.get("m"); if(q.get("cta")==="0")cta.style.display="none";
fetch("data.json?"+Date.now()).then(r=>r.json()).then(j=>{data=j;upd.textContent=`${j.updated.replace(/-/g,"/").replace(/^\d+\//,"").replace(/^0/,"")} 更新`;draw()}).catch(draw);
</script></body></html>
